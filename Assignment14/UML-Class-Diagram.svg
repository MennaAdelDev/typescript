<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="902" viewBox="0 0 1100 902"><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold">Simple Notes Management System - UML Class Diagram</text><rect x="60" y="70" width="400" height="314" fill="#ffffff" stroke="#222" stroke-width="1.6"/><rect x="60" y="70" width="400" height="34" fill="#e8eefc" stroke="#222" stroke-width="1.6"/><text x="260.0" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">User</text><text x="70" y="120" font-family="Consolas, Menlo, monospace" font-size="13"># id: number</text><text x="70" y="140" font-family="Consolas, Menlo, monospace" font-size="13">+ name: string</text><text x="70" y="160" font-family="Consolas, Menlo, monospace" font-size="13">+ email: string</text><text x="70" y="180" font-family="Consolas, Menlo, monospace" font-size="13">- password: string</text><text x="70" y="200" font-family="Consolas, Menlo, monospace" font-size="13">+ phone: string</text><text x="70" y="220" font-family="Consolas, Menlo, monospace" font-size="13">- age: number</text><text x="70" y="240" font-family="Consolas, Menlo, monospace" font-size="13">- notebooks: NoteBook[]</text><line x1="60" y1="254" x2="460" y2="254" stroke="#222" stroke-width="1.6"/><text x="70" y="270" font-family="Consolas, Menlo, monospace" font-size="13">+ displayInfo(): void</text><text x="70" y="290" font-family="Consolas, Menlo, monospace" font-size="13">+ getId(): number</text><text x="70" y="310" font-family="Consolas, Menlo, monospace" font-size="13">+ getName(): string</text><text x="70" y="330" font-family="Consolas, Menlo, monospace" font-size="13">+ addNotebook(notebook: NoteBook): void</text><text x="70" y="350" font-family="Consolas, Menlo, monospace" font-size="13">+ removeNotebook(id: number): boolean</text><text x="70" y="370" font-family="Consolas, Menlo, monospace" font-size="13">+ getNotebooks(): NoteBook[]</text><rect x="60" y="504" width="400" height="78" fill="#ffffff" stroke="#222" stroke-width="1.6"/><rect x="60" y="504" width="400" height="34" fill="#e8eefc" stroke="#222" stroke-width="1.6"/><text x="260.0" y="526" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Admin</text><line x1="60" y1="552" x2="460" y2="552" stroke="#222" stroke-width="1.6"/><text x="70" y="568" font-family="Consolas, Menlo, monospace" font-size="13">+ manageNotes(notebook, action, noteId?): void</text><rect x="640" y="70" width="400" height="174" fill="#ffffff" stroke="#222" stroke-width="1.6"/><rect x="640" y="70" width="400" height="34" fill="#e8eefc" stroke="#222" stroke-width="1.6"/><text x="840.0" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">NoteBook</text><text x="650" y="120" font-family="Consolas, Menlo, monospace" font-size="13">+ id: number</text><text x="650" y="140" font-family="Consolas, Menlo, monospace" font-size="13">+ title: string</text><text x="650" y="160" font-family="Consolas, Menlo, monospace" font-size="13">- notes: Note[]</text><line x1="640" y1="174" x2="1040" y2="174" stroke="#222" stroke-width="1.6"/><text x="650" y="190" font-family="Consolas, Menlo, monospace" font-size="13">+ addNote(id, title, content, author): Note</text><text x="650" y="210" font-family="Consolas, Menlo, monospace" font-size="13">+ removeNote(id: number): boolean</text><text x="650" y="230" font-family="Consolas, Menlo, monospace" font-size="13">+ getNotes(): Note[]</text><rect x="640" y="434" width="400" height="194" fill="#ffffff" stroke="#222" stroke-width="1.6"/><rect x="640" y="434" width="400" height="34" fill="#e8eefc" stroke="#222" stroke-width="1.6"/><text x="840.0" y="456" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Note</text><text x="650" y="484" font-family="Consolas, Menlo, monospace" font-size="13">+ id: number</text><text x="650" y="504" font-family="Consolas, Menlo, monospace" font-size="13">+ title: string</text><text x="650" y="524" font-family="Consolas, Menlo, monospace" font-size="13">+ content: string</text><text x="650" y="544" font-family="Consolas, Menlo, monospace" font-size="13">+ userId: number</text><text x="650" y="564" font-family="Consolas, Menlo, monospace" font-size="13">- author: User</text><line x1="640" y1="578" x2="1040" y2="578" stroke="#222" stroke-width="1.6"/><text x="650" y="594" font-family="Consolas, Menlo, monospace" font-size="13">+ preview(length?: number): string</text><text x="650" y="614" font-family="Consolas, Menlo, monospace" font-size="13">+ getAuthor(): User</text><rect x="60" y="672" width="400" height="134" fill="#ffffff" stroke="#222" stroke-width="1.6"/><rect x="60" y="672" width="400" height="34" fill="#e8eefc" stroke="#222" stroke-width="1.6"/><text x="260.0" y="694" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Storage&lt;T&gt;</text><text x="70" y="722" font-family="Consolas, Menlo, monospace" font-size="13">- items: T[]</text><line x1="60" y1="736" x2="460" y2="736" stroke="#222" stroke-width="1.6"/><text x="70" y="752" font-family="Consolas, Menlo, monospace" font-size="13">+ addItem(item: T): void</text><text x="70" y="772" font-family="Consolas, Menlo, monospace" font-size="13">+ removeItem(item: T): boolean</text><text x="70" y="792" font-family="Consolas, Menlo, monospace" font-size="13">+ getAllItems(): T[]</text><line x1="260.0" y1="406" x2="260.0" y2="504" stroke="#222" stroke-width="1.6"/><polygon points="260.0,384 248.0,406 272.0,406" fill="#ffffff" stroke="#222" stroke-width="1.6"/><text x="274.0" y="446" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#222">Inheritance (extends)</text><line x1="484" y1="120" x2="640" y2="120" stroke="#222" stroke-width="1.6"/><polygon points="460,120 472,112 484,120 472,128" fill="#ffffff" stroke="#222" stroke-width="1.6"/><text x="562.0" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#222">Aggregation (owns)</text><text x="466" y="144" text-anchor="start" font-family="Arial, sans-serif" font-size="13" fill="#222">1</text><text x="632" y="144" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#222">0..*</text><line x1="840.0" y1="268" x2="840.0" y2="434" stroke="#222" stroke-width="1.6"/><polygon points="840.0,244 832.0,256 840.0,268 848.0,256" fill="#222222" stroke="#222" stroke-width="1.6"/><text x="854.0" y="343.0" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#222">Composition (contains)</text><text x="854.0" y="284" text-anchor="start" font-family="Arial, sans-serif" font-size="13" fill="#222">1</text><text x="854.0" y="424" text-anchor="start" font-family="Arial, sans-serif" font-size="13" fill="#222">0..*</text><line x1="640" y1="494" x2="520" y2="494" stroke="#222" stroke-width="1.6"/><line x1="520" y1="494" x2="520" y2="320" stroke="#222" stroke-width="1.6"/><line x1="520" y1="320" x2="460" y2="320" stroke="#222" stroke-width="1.6"/><polyline points="472,312 460,320 472,328" fill="none" stroke="#222" stroke-width="1.6"/><text x="530" y="407.0" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#222">Association (author)</text><text x="632" y="486" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#222">0..*</text><text x="478" y="308" text-anchor="start" font-family="Arial, sans-serif" font-size="13" fill="#222">1</text><rect x="640" y="662" width="400" height="190" fill="#fafafa" stroke="#888" stroke-width="1.2"/><text x="654" y="686" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#222">Relationships</text><line x1="660" y1="716" x2="740" y2="716" stroke="#222" stroke-width="1.6"/><polygon points="740,716 752,708 752,724" fill="#ffffff" stroke="#222" stroke-width="1.6"/><text x="770" y="721" text-anchor="start" font-family="Arial, sans-serif" font-size="13" fill="#222">Inheritance: Admin extends User</text><line x1="684" y1="750" x2="752" y2="750" stroke="#222" stroke-width="1.6"/><polygon points="660,750 672,742 684,750 672,758" fill="#ffffff" stroke="#222" stroke-width="1.6"/><text x="770" y="755" text-anchor="start" font-family="Arial, sans-serif" font-size="13" fill="#222">Aggregation: User owns NoteBooks</text><line x1="684" y1="784" x2="752" y2="784" stroke="#222" stroke-width="1.6"/><polygon points="660,784 672,776 684,784 672,792" fill="#222222" stroke="#222" stroke-width="1.6"/><text x="770" y="789" text-anchor="start" font-family="Arial, sans-serif" font-size="13" fill="#222">Composition: NoteBook contains Notes</text><line x1="660" y1="818" x2="752" y2="818" stroke="#222" stroke-width="1.6"/><polyline points="740,810 752,818 740,826" fill="none" stroke="#222" stroke-width="1.6"/><text x="770" y="823" text-anchor="start" font-family="Arial, sans-serif" font-size="13" fill="#222">Association: Note has an author (User)</text></svg>